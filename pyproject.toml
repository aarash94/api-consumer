[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-consumer"
version = "0.1.0"
description = "Client that creates and deletes a group across all nodes of a cluster"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
